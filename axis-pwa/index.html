<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <meta name="description" content="Axis — Central pessoal de produtividade, estudos, carreira, projetos e metas." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Axis" />

  <title>Axis — Painel Pessoal</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Barra Lateral (Desktop) -->
    <aside class="sidebar" aria-label="Navegação principal">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3L20 19H4L12 3Z" />
              <path d="M12 11V19" />
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">Axis</span>
            <span class="brand-tag">Workspace Pessoal</span>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <button class="nav-item active" data-route="dashboard">
          <span class="nav-icon" data-icon="layout-dashboard"></span>
          <span>Visão Geral</span>
        </button>
        <button class="nav-item" data-route="tasks">
          <span class="nav-icon" data-icon="check-square"></span>
          <span>Tarefas</span>
          <span class="nav-badge" id="badge-tasks">0</span>
        </button>
        <button class="nav-item" data-route="courses">
          <span class="nav-icon" data-icon="book-open"></span>
          <span>Estudos & Cursos</span>
          <span class="nav-badge" id="badge-courses">0</span>
        </button>
        <button class="nav-item" data-route="career">
          <span class="nav-icon" data-icon="briefcase"></span>
          <span>Carreira & Vagas</span>
          <span class="nav-badge" id="badge-career">0</span>
        </button>
        <button class="nav-item" data-route="projects">
          <span class="nav-icon" data-icon="folder-git"></span>
          <span>Projetos</span>
          <span class="nav-badge" id="badge-projects">0</span>
        </button>
        <button class="nav-item" data-route="goals">
          <span class="nav-icon" data-icon="target"></span>
          <span>Metas</span>
          <span class="nav-badge" id="badge-goals">0</span>
        </button>
        <button class="nav-item" data-route="notes">
          <span class="nav-icon" data-icon="file-text"></span>
          <span>Bloco de Notas</span>
          <span class="nav-badge" id="badge-notes">0</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="btn-sidebar-action hidden" id="btn-install-sidebar">
          <span data-icon="download"></span>
          <span>Instalar Aplicativo</span>
        </button>
        <button class="btn-sidebar-action" data-action="open-settings">
          <span data-icon="database"></span>
          <span>Backup & Ajustes</span>
        </button>
      </div>
    </aside>

    <!-- Área Principal -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <div class="mobile-brand">
            <span class="mobile-brand-dot"></span>
            <span id="mobile-page-title">Visão Geral</span>
          </div>
          <div class="topbar-date" id="topbar-date"></div>
        </div>

        <div class="topbar-right">
          <div class="digital-clock" id="digital-clock" title="Relógio digital">00:00:00</div>
          <button class="icon-btn" id="btn-toggle-clock" title="Alternar relógio digital" aria-label="Alternar relógio digital">
            <span data-icon="clock"></span>
          </button>
          <button class="icon-btn hidden" id="btn-install-topbar" title="Instalar aplicativo" aria-label="Instalar aplicativo">
            <span data-icon="download"></span>
          </button>
          <button class="icon-btn" data-action="open-settings" title="Backup e Configurações" aria-label="Backup e Configurações">
            <span data-icon="settings"></span>
          </button>
        </div>
      </header>

      <main class="main-content" id="app-view" aria-live="polite"></main>
    </div>

    <!-- Navegação Inferior (Mobile / Tablet) -->
    <nav class="bottom-nav" id="bottom-nav" aria-label="Navegação mobile">
      <button class="bottom-nav-item active" data-route="dashboard">
        <span data-icon="layout-dashboard"></span>
        <span>Início</span>
      </button>
      <button class="bottom-nav-item" data-route="tasks">
        <span data-icon="check-square"></span>
        <span>Tarefas</span>
      </button>
      <button class="bottom-nav-item" data-route="courses">
        <span data-icon="book-open"></span>
        <span>Estudos</span>
      </button>
      <button class="bottom-nav-item" data-route="career">
        <span data-icon="briefcase"></span>
        <span>Vagas</span>
      </button>
      <button class="bottom-nav-item" data-route="projects">
        <span data-icon="folder-git"></span>
        <span>Projetos</span>
      </button>
      <button class="bottom-nav-item" data-route="goals">
        <span data-icon="target"></span>
        <span>Metas</span>
      </button>
      <button class="bottom-nav-item" data-route="notes">
        <span data-icon="file-text"></span>
        <span>Notas</span>
      </button>
    </nav>
  </div>

  <!-- Modal Universal -->
  <div class="modal-backdrop hidden" id="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-panel" id="modal-panel">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Título</h2>
        <button class="icon-btn" id="modal-close" aria-label="Fechar janela">
          <span data-icon="x"></span>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Banner de Atualização PWA -->
  <div class="update-banner hidden" id="update-banner" role="status">
    <div class="update-banner-text">
      <strong>Nova versão disponível</strong>
      <span>Atualize para carregar as melhorias mais recentes.</span>
    </div>
    <button class="btn btn-primary btn-sm" id="btn-sw-update">Atualizar</button>
  </div>

  <!-- Container de Notificações (Toasts) -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script src="./js/icons.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
